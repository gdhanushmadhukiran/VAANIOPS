# ==============================================================================
# VaaniOps — Evon v3.3 Secure Reverse Proxy Configuration
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Logging settings
    log_format custom '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" request_time=$request_time';

    access_log /var/log/nginx/access.log custom;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 120s;

    # Rate limiting: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=evon_rate_limit:10m rate=10r/s;
    limit_req_status 429;

    # Map for Bearer token & X-API-Key-ID authentication
    map $http_authorization $auth_valid_bearer {
        default 0;
        "Bearer ${EVON_GPU_SECRET}" 1;
    }

    map $http_x_api_key_id $auth_valid_header {
        default 0;
        "${EVON_GPU_SECRET}" 1;
    }

    server {
        listen 80;
        server_name _;

        # Redirect plain HTTP to HTTPS in production
        # In internal VPC networks, this can be toggled
        location /health {
            # Public unauthenticated health check for load balancer & FastAPI probe
            proxy_pass http://vllm:8000/health;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location / {
            # Check authentication on all other endpoints
            set $authorized 0;
            if ($auth_valid_bearer) {
                set $authorized 1;
            }
            if ($auth_valid_header) {
                set $authorized 1;
            }

            if ($authorized = 0) {
                return 401 '{"error": "UNAUTHORIZED", "message": "Invalid or missing GPU Service Secret token."}';
            }

            limit_req zone=evon_rate_limit burst=20 nodelay;

            proxy_pass http://vllm:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering & streaming
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_http_version 1.1;

            # Extended timeouts for LLM reasoning and 128K context generation
            proxy_connect_timeout 30s;
            proxy_send_timeout    180s;
            proxy_read_timeout    180s;
        }
    }
}

